name: Test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # stdlib-only: there is no go.sum to key a cache on
          cache: false

      - run: go test ./...

      - run: go vet ./...

      # Run via `go run` so govulncheck never lands in go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  released-binaries:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # Binary mode reads the stdlib version embedded in each artifact, so the
      # host toolchain only needs to build govulncheck; no checkout required.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      # Glob every release asset so newly added platforms are scanned without
      # editing this workflow (CLAUDE.md requires scanning all artifacts).
      - name: Download latest release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern 'goup-*' --dir "$RUNNER_TEMP/released-binaries"

      - name: Scan every released binary
        run: |
          status=0
          for bin in "$RUNNER_TEMP"/released-binaries/goup-*; do
            # Skip sidecar files such as checksums; binaries have no extension.
            case "$(basename "$bin")" in *.*) continue ;; esac
            echo "::group::$(basename "$bin")"
            go run golang.org/x/vuln/cmd/govulncheck@latest -mode=binary "$bin" || status=1
            echo "::endgroup::"
          done
          exit "$status"
